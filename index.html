<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Two draggable boards (Life, Tools) under a pill tab switch; transparent so it sits on any page */
  :root {
    --ink: #000000;
    --muted: rgba(0, 0, 0, 0.6);
    --track: rgba(0, 0, 0, 0.05);
    --paper: #ffffff;
    --serif: "Newsreader", "Source Serif 4", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0; }

  /* Tabs */
  .tabs {
    position: relative;
    display: inline-flex;
    gap: 2px;
    padding: 4px;
    margin-bottom: 28px;
    background: var(--track);
    border-radius: 999px;
  }
  .tabs .indicator {
    position: absolute;
    top: 4px; bottom: 4px; left: 0;
    width: 0;
    background: var(--ink);
    border-radius: 999px;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), width .35s cubic-bezier(.2,.7,.2,1);
  }
  .tabs button {
    position: relative;
    z-index: 1;
    font: 500 14px/1 var(--sans);
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: color .25s ease;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: #fff; }
  .tabs button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Board */
  .stage { position: relative; touch-action: pan-y; }
  .card {
    position: absolute;
    top: 0; left: 0;
    width: var(--w);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    transform: translate(var(--x), var(--y)) rotate(var(--r));
    will-change: transform;
    opacity: 0;
  }
  .stage.ready .card {
    opacity: 1;
    transition: transform .6s cubic-bezier(.2,.7,.2,1), opacity .5s ease;
    transition-delay: var(--d, 0ms);
  }
  .stage.ready .card.dragging { cursor: grabbing; transition: none; }
  .card .media {
    position: relative;
    transition: transform .25s ease, box-shadow .25s ease;
    box-shadow: 0 1px 2px rgba(29,28,26,.08), 0 8px 24px rgba(29,28,26,.08);
  }
  .card.object .media { box-shadow: none; }
  .card img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; }
  .card:hover .media { transform: scale(1.015); }
  .card.dragging .media {
    transform: scale(1.04);
    box-shadow: 0 2px 4px rgba(29,28,26,.08), 0 24px 48px rgba(29,28,26,.18);
  }
  .card.object.dragging .media { box-shadow: none; filter: drop-shadow(0 18px 24px rgba(29,28,26,.18)); }
  .card:focus-visible { outline: 1px solid var(--ink); outline-offset: 8px; }
  .card figcaption { margin-top: 10px; font-size: 14px; line-height: 1.4; color: var(--muted); }
  .card figcaption strong {
    display: block;
    font-family: var(--serif); font-weight: 600;
    font-size: 20px; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
    margin-bottom: 2px;
  }


  /* Tools: a timeline of things I've built. Text on the left, screenshot on the right */
  .log { --line: rgba(0, 0, 0, 0.1); border-left: 1px solid var(--line); }
  .log.enter .entry { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .log.enter .entry:nth-child(2) { animation-delay: 80ms; }
  .log.enter .entry:nth-child(3) { animation-delay: 160ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .entry {
    display: grid;
    grid-template-columns: minmax(0, 36%) minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    grid-template-areas: "head shot" "info shot";
    column-gap: 32px;
    padding: 0 0 72px 28px;
  }
  .entry:last-child { padding-bottom: 0; }
  .entry .head {
    grid-area: head;
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  /* rounded elbow from the vertical line into the chips */
  .entry .head::before {
    content: "";
    position: absolute;
    left: -29px; top: -1px;
    width: 22px; height: 15px;
    border-left: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    border-bottom-left-radius: 12px;
  }
  /* line from the chips over to the screenshot */
  .entry .head::after {
    content: "";
    flex: 1;
    min-width: 12px;
    height: 1px;
    margin-right: -32px;
    background: var(--line);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .chip svg { flex: none; width: 11px; height: 11px; }
  .entry .info { grid-area: info; min-width: 0; padding-top: 20px; }
  .shot {
    grid-area: shot;
    display: block;
    min-width: 0;
    align-self: start;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.12);
  }
  .shot img {
    display: block;
    width: 100%;
    height: auto;
    transition: transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .shot:hover img { transform: scale(1.02); }
  .shot:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  /* Same text styles as the project descriptions on anderscarlson.co */
  .entry p { font-size: 17px; line-height: 1.7; letter-spacing: 0; color: #000000; }
  .entry p strong { font-weight: 700; }
  .entry p + p { margin-top: 20px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .links a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    font-size: 14px; color: var(--ink); text-decoration: none;
    background: var(--track);
    border-radius: 6px;
    transition: background .2s ease;
  }
  .links a:hover { background: rgba(0, 0, 0, 0.09); }
  .links a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .links a span { color: var(--muted); transition: transform .2s ease; }
  .links a:hover span { transform: translate(2px, -2px); }

  @media (max-width: 720px) {
    .tabs { margin-bottom: 20px; }
    .card figcaption { margin-top: 8px; font-size: 11px; }
    .card figcaption strong { font-size: 15px; }
    .entry {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto;
      grid-template-areas: "head" "shot" "info";
      row-gap: 14px;
      padding: 0 0 56px 20px;
    }
    .entry .head::before { left: -21px; width: 14px; }
    .entry .head::after { margin-right: 0; }
    .entry .info { padding-top: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage.ready .card, .tabs .indicator, .shot img { transition: none; }
    .log.enter .entry { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist" aria-label="Play">
    <span class="indicator" aria-hidden="true"></span>
    <button role="tab" id="tab-tools" aria-controls="board-tools" aria-selected="true">Tools</button>
    <button role="tab" id="tab-life" aria-controls="board-life" aria-selected="false" tabindex="-1">Life</button>
  </div>

  <section class="log" id="board-tools" role="tabpanel" aria-labelledby="tab-tools"></section>
  <section class="stage" id="board-life" role="tabpanel" aria-labelledby="tab-life" hidden></section>
</div>

<script>
/* ============================================================
   EDIT YOUR BOARDS HERE
   Photo cards:  src, title, caption, object (true = record/book, no shadow box)
   Tool cards:   tool (big name on the card), kind (small label), title, caption
   desk / mobile: starting layout
     x, y = position as % of the board width (top-left corner of the card)
     w    = width as % of the board
     r    = rotation in degrees
   ============================================================ */
const LIFE = [
  { src: "painting.jpg", title: "Mt. Wilson", caption: "Oil on canvas, 2024",
    desk: { x: 3,  y: 3.7, w: 26, r: -4 },  mobile: { x: 2,  y: 0,    w: 48, r: -3 } },
  { src: "ski.jpg", title: "Skinning up Mt. Hood", caption: "A crisp morning in the mountains",
    desk: { x: 31, y: 0.7, w: 35, r: 2.5 }, mobile: { x: 3,  y: 81,   w: 52, r: -2 } },
  { src: "album.webp", object: true, title: "Purgatory, Tyler Childers", caption: "On repeat",
    desk: { x: 70, y: 3.7, w: 27, r: 5 },   mobile: { x: 52, y: 33.5, w: 44, r: 5 } },
  { src: "river.jpg", title: "Down the canyon", caption: "Boating my bucket list river",
    desk: { x: 11, y: 38.4, w: 22, r: 3 },  mobile: { x: 4,  y: 140,  w: 40, r: -3 } },
  { src: "dog.jpg", title: "Trail partner", caption: "Always in front",
    desk: { x: 37, y: 36.9, w: 22, r: -5 }, mobile: { x: 54, y: 95,   w: 38, r: 4 } },
  { src: "book.jpg", object: true, title: "Into Thin Air", caption: "A favorite read",
    desk: { x: 66, y: 34, w: 18, r: -3 },   mobile: { x: 52, y: 165,  w: 34, r: 3 } }
];

/* Tools timeline: newest first. Each entry: category, tag, image, title, text (paragraphs), links */
const TOOLS = [
  {
    category: "Finance",
    tag: "Open source",
    image: "never-budget.jpg",
    url: "https://anderscarlson.github.io/Never-Budget/",
    title: "Never Budget",
    text: [
      "An envelope budget that gives every dollar a job before the month starts, so savings and bills leave on payday and you spend what's left."
    ],
    links: [
      { label: "Open the tool", href: "https://anderscarlson.github.io/Never-Budget/" },
      { label: "Fork on GitHub", href: "https://github.com/AndersCarlson/Never-Budget/fork" }
    ]
  },
  {
    category: "Design",
    tag: "Open source",
    image: "gradient-grain.jpg",
    url: "https://anderscarlson.github.io/Gradient-Tool/",
    title: "Gradient + Grain",
    text: [
      "Build a gradient, lay film grain over it, and take it away as CSS or a PNG."
    ],
    links: [
      { label: "Open the tool", href: "https://anderscarlson.github.io/Gradient-Tool/" },
      { label: "Fork on GitHub", href: "https://github.com/AndersCarlson/Gradient-Tool/fork" }
    ]
  }
];

/* ---------- Board engine ---------- */
const isMobile = () => window.innerWidth <= 720;

function createBoard(stage, items) {
  let z = items.length, active = null;

  const cards = items.map((n, i) => {
    const el = document.createElement("figure");
    el.className = "card" + (n.object ? " object" : "");
    el.tabIndex = 0;
    el.style.zIndex = i + 1;
    el.style.setProperty("--d", `${i * 80}ms`);
    const media = n.tool
      ? `<div class="media paper"><span class="kind">${n.kind}</span><span class="name">${n.tool}</span></div>`
      : `<div class="media"><img src="${n.src}" alt="${n.title}" draggable="false"></div>`;
    const head = n.tool ? "" : `<strong>${n.title}</strong>`;   // tool cards already show the name
    el.innerHTML = `${media}<figcaption>${head}${n.caption}</figcaption>`;
    stage.appendChild(el);
    return { el, n, x: 0, y: 0, r: 0 };
  });

  const key = () => (isMobile() ? "mobile" : "desk");

  function place(c, x, y, r) {
    c.x = x; c.y = y; c.r = r;
    c.el.style.setProperty("--x", `${x}px`);
    c.el.style.setProperty("--y", `${y}px`);
    c.el.style.setProperty("--r", `${r}deg`);
  }

  /* Lay out every card, then size the board to fit them exactly */
  function tidy() {
    if (stage.hidden) return;
    const k = key(), W = stage.clientWidth;
    cards.forEach(c => c.el.style.setProperty("--w", `${c.n[k].w}%`));
    const boxes = cards.map(c => {
      const L = c.n[k];
      const w = (L.w / 100) * W, h = c.el.offsetHeight;
      const a = Math.abs(L.r * Math.PI / 180);
      const half = (w * Math.sin(a) + h * Math.cos(a)) / 2;
      const x = (L.x / 100) * W, y = (L.y / 100) * W;
      return { c, L, x, y, top: y + h / 2 - half, bottom: y + h / 2 + half };
    });
    const top = Math.min(...boxes.map(b => b.top));
    const bottom = Math.max(...boxes.map(b => b.bottom));
    stage.style.height = `${Math.ceil(bottom - top)}px`;
    boxes.forEach(b => place(b.c, b.x, b.y - top, b.L.r));
  }

  function clamp(c, x, y) {
    const W = stage.clientWidth, H = stage.clientHeight;
    const w = c.el.offsetWidth, h = c.el.offsetHeight;
    return [
      Math.min(Math.max(x, -w * 0.25), W - w * 0.75),
      Math.min(Math.max(y, -h * 0.1), H - h * 0.6)
    ];
  }

  stage.addEventListener("pointerdown", e => {
    const el = e.target.closest(".card");
    if (!el || e.button > 0) return;
    const c = cards.find(k => k.el === el);
    active = { c, sx: e.clientX, sy: e.clientY, ox: c.x, oy: c.y };
    el.style.zIndex = ++z;
    el.classList.add("dragging");
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  stage.addEventListener("pointermove", e => {
    if (!active) return;
    const { c, sx, sy, ox, oy } = active;
    const [x, y] = clamp(c, ox + e.clientX - sx, oy + e.clientY - sy);
    const tilt = Math.max(-8, Math.min(8, (e.movementX || 0) * 0.6));
    place(c, x, y, c.n[key()].r * 0.5 + tilt);
  });
  const release = () => {
    if (!active) return;
    const { c } = active;
    c.el.classList.remove("dragging");
    place(c, c.x, c.y, c.n[key()].r * 0.5);
    active = null;
  };
  stage.addEventListener("pointerup", release);
  stage.addEventListener("pointercancel", release);

  stage.addEventListener("keydown", e => {
    const el = e.target.closest(".card");
    if (!el) return;
    const step = e.shiftKey ? 40 : 12;
    const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!d) return;
    e.preventDefault();
    const c = cards.find(k => k.el === el);
    el.style.zIndex = ++z;
    const [x, y] = clamp(c, c.x + d[0], c.y + d[1]);
    place(c, x, y, c.r);
  });

  /* Show the board: lay it out, then deal the cards in */
  function enter() {
    stage.classList.remove("ready");
    imagesLoaded.then(() => {
      if (stage.hidden) return;
      tidy();
      void stage.offsetWidth;
      requestAnimationFrame(() => stage.classList.add("ready"));
    });
  }

  const imagesLoaded = Promise.all([...stage.querySelectorAll("img")].map(img =>
    img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })
  ));

  return { stage, tidy, enter, imagesLoaded };
}

const ICON_DATE = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><g stroke="#c9a24a" stroke-width="1.6" stroke-linecap="round"><path d="M7 1.5v11M1.5 7h11M3.1 3.1l7.8 7.8M10.9 3.1l-7.8 7.8"/></g></svg>`;
const ICON_TAG = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4 1.5 7l3 3M9.5 4l3 3-3 3"/></svg>`;

function createLog(stage, entries) {
  stage.innerHTML = entries.map(e => `
    <article class="entry">
      <div class="head">
        <span class="chip">${ICON_DATE}${e.category}</span>
        <span class="chip">${ICON_TAG}${e.tag}</span>
      </div>
      <div class="info">
        ${e.text.map((p, i) => i === 0
          ? `<p><strong>${e.title}</strong> – ${p}</p>`
          : `<p>${p}</p>`).join("")}
        <div class="links">
          ${e.links.map(l => `<a href="${l.href}" target="_blank" rel="noopener">${l.label} <span aria-hidden="true">↗</span></a>`).join("")}
        </div>
      </div>
      <a class="shot" href="${e.url}" target="_blank" rel="noopener" aria-label="Open ${e.title}">
        <img src="${e.image}" alt="Screenshot of ${e.title}" loading="lazy">
      </a>
    </article>`).join("");
  return {
    stage,
    tidy() {},
    enter() {
      stage.classList.remove("enter");
      void stage.offsetWidth;
      stage.classList.add("enter");
    }
  };
}

const boards = {
  life: createBoard(document.getElementById("board-life"), LIFE),
  tools: createLog(document.getElementById("board-tools"), TOOLS)
};

/* ---------- Tabs ---------- */
const tabs = [...document.querySelectorAll('.tabs [role="tab"]')];
const indicator = document.querySelector(".tabs .indicator");
let current = "tools";

function moveIndicator(btn) {
  indicator.style.width = `${btn.offsetWidth}px`;
  indicator.style.transform = `translateX(${btn.offsetLeft}px)`;
}

function select(name, focus) {
  if (name === current) return;
  tabs.forEach(t => {
    const on = t.id === `tab-${name}`;
    t.setAttribute("aria-selected", on);
    t.tabIndex = on ? 0 : -1;
    if (on) { moveIndicator(t); if (focus) t.focus(); }
  });
  boards[current].stage.hidden = true;
  boards[current].stage.classList.remove("ready");
  boards[name].stage.hidden = false;
  current = name;
  boards[name].enter();
}

tabs.forEach((t, i) => {
  t.addEventListener("click", () => select(t.id.replace("tab-", "")));
  t.addEventListener("keydown", e => {
    const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
    if (!d) return;
    e.preventDefault();
    const next = tabs[(i + d + tabs.length) % tabs.length];
    select(next.id.replace("tab-", ""), true);
  });
});

/* ---------- Start ---------- */
moveIndicator(tabs[0]);
boards.tools.enter();
if (document.fonts) document.fonts.ready.then(() => {
  moveIndicator(document.querySelector('.tabs [aria-selected="true"]'));
  boards[current].tidy();
});

let lastW = window.innerWidth, rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    moveIndicator(document.querySelector('.tabs [aria-selected="true"]'));
    boards[current].tidy();
  }, 120);
});
</script>
</body>
</html>
